<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Мои задачи</h1>
        
        <div class="input-group">
            <input type="text" id="task-input" placeholder="Введите задачу...">
            <button id="add-btn">Добавить</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Завершенные</button>
        </div>

        <div class="counter" id="counter">Осталось: 0, Выполнено: 0</div>

        <ul id="task-list" class="task-list"></ul>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
